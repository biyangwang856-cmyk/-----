[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"
[project]
name = "white-render-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<2.3", "Pillow>=10,<13", "av>=15,<17", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1"]
[project.optional-dependencies]
simulation = ["pybullet==3.2.7"]
dev = ["pytest>=8,<10"]
[project.scripts]
white-render = "white_render_backend.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real CPU physical simulation"]
